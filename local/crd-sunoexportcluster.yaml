apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sunoexportclusters.suno.mikegales.dev
spec:
  group: suno.mikegales.dev
  scope: Namespaced
  names:
    plural: sunoexportclusters
    singular: sunoexportcluster
    kind: SunoExportCluster
    shortNames:
      - sec
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .status.image
        - name: Endpoint
          type: string
          jsonPath: .status.endpoint
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - image
                - secrets
                - sharedStorage
              properties:
                image:
                  type: object
                  required:
                    - repository
                  properties:
                    repository:
                      type: string
                    tag:
                      type: string
                    pullPolicy:
                      type: string
                secrets:
                  type: object
                  required:
                    - postgresUrlSecret
                    - mqttUrlSecret
                  properties:
                    postgresUrlSecret:
                      type: object
                      required:
                        - name
                        - key
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                    mqttUrlSecret:
                      type: object
                      required:
                        - name
                        - key
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                sharedStorage:
                  type: object
                  required:
                    - existingClaim
                  properties:
                    existingClaim:
                      type: string
                    mountPath:
                      type: string
                runtime:
                  type: object
                  properties:
                    cacheDir:
                      type: string
                    outputRoot:
                      type: string
                    libraryRoot:
                      type: string
                    databaseType:
                      type: string
                    metadataDatabase:
                      type: string
                    mqttTopicPrefix:
                      type: string
                    logFile:
                      type: string
                api:
                  type: object
                  properties:
                    replicas:
                      type: integer
                      minimum: 0
                    host:
                      type: string
                    port:
                      type: integer
                      minimum: 1
                workers:
                  type: object
                  properties:
                    auth:
                      type: object
                      properties:
                        replicas:
                          type: integer
                          minimum: 0
                    metadata:
                      type: object
                      properties:
                        replicas:
                          type: integer
                          minimum: 0
                    asset:
                      type: object
                      properties:
                        replicas:
                          type: integer
                          minimum: 0
                    conversion:
                      type: object
                      properties:
                        replicas:
                          type: integer
                          minimum: 0
                librarians:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    dynamicDiscovery:
                      type: boolean
                    defaultSchedule:
                      type: string
                    defaultIntervalMs:
                      type: integer
                      minimum: 1
                    manualJobTtlSeconds:
                      type: integer
                      minimum: 1
                    workspaces:
                      type: array
                      items:
                        type: object
                        required:
                          - workspace
                        properties:
                          workspace:
                            type: string
                          schedule:
                            type: string
                          intervalMs:
                            type: integer
                            minimum: 1
                serviceAccountName:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
