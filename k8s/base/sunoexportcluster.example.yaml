apiVersion: suno.mikegales.dev/v1alpha1
kind: SunoExportCluster
metadata:
  name: main
  namespace: suno-export
spec:
  image:
    repository: ghcr.io/mikeygnyc/suno-export
    tag: latest
    pullPolicy: IfNotPresent
  secrets:
    postgresUrlSecret:
      name: suno-export-runtime
      key: postgres-url
    mqttUrlSecret:
      name: suno-export-runtime
      key: mqtt-url
  sharedStorage:
    existingClaim: suno-export-shared
    mountPath: /var/lib/suno-export
  runtime:
    databaseType: postgres
    mqttTopicPrefix: suno-export/control-plane
    cacheDir: /var/lib/suno-export/cache
    outputRoot: /var/lib/suno-export/downloads
    libraryRoot: /var/lib/suno-export/library
    logFile: /var/lib/suno-export/logs/http-api.log
  api:
    replicas: 1
    host: 0.0.0.0
    port: 3000
  workers:
    auth:
      replicas: 1
    metadata:
      replicas: 1
    asset:
      replicas: 1
    conversion:
      replicas: 2
  librarians:
    enabled: true
    dynamicDiscovery: true
    defaultIntervalMs: 21600000
    defaultSchedule: "0 */6 * * *"
    manualJobTtlSeconds: 3600
