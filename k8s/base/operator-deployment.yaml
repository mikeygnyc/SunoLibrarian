apiVersion: apps/v1
kind: Deployment
metadata:
  name: suno-export-k8s-operator
  namespace: suno-export
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: suno-export
      app.kubernetes.io/component: k8s-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suno-export
        app.kubernetes.io/component: k8s-operator
    spec:
      serviceAccountName: suno-export-k8s-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/mikeygnyc/suno-export:latest
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /app/dist/apps/k8s-operator/main.js
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: SUNO_EXPORT_APP
              value: k8s-operator
            - name: SUNO_EXPORT_OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
