apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: suno-export-filebeat
  namespace: suno-export
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: suno-export-filebeat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suno-export-filebeat
    spec:
      serviceAccountName: suno-export-filebeat
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:9.4.1
          args: ["-c", "/etc/filebeat.yml", "-e"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ELASTICSEARCH_HOSTS
              valueFrom:
                secretKeyRef:
                  name: suno-export-filebeat
                  key: elasticsearch-hosts
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: suno-export-filebeat
                  key: elasticsearch-username
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: suno-export-filebeat
                  key: elasticsearch-password
            - name: SUNO_EXPORT_ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: suno-export-filebeat
                  key: environment
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 500Mi
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat.yml
              readOnly: true
              subPath: filebeat.yml
            - name: data
              mountPath: /usr/share/filebeat/data
            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            defaultMode: 0600
            name: suno-export-filebeat
        - name: data
          hostPath:
            path: /var/lib/suno-export-filebeat-data
            type: DirectoryOrCreate
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
